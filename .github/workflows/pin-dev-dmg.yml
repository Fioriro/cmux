name: Build pin-dev DMG

on:
  push:
    branches: [pin-dev]
    paths:
      - cmux-always-on-top.patch
      - .github/workflows/pin-dev-dmg.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-26
    timeout-minutes: 120
    env:
      CMUX_DEV_BACKEND_MODE: local
      CMUX_SKIP_ZIG_BUILD: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          submodules: recursive
          persist-credentials: false
      - name: Apply the window pin patch
        run: |
          git apply --check cmux-always-on-top.patch
          git apply cmux-always-on-top.patch
      - name: Select Xcode
        run: CMUX_CI_MAX_MACOS_SDK_MAJOR=26 ./scripts/select-ci-xcode.sh
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"
      - name: Install Rust and GhosttyKit
        run: |
          ./scripts/install-rust-ci.sh
          ./scripts/download-prebuilt-ghosttykit.sh
      - name: Build tagged Debug app and create disk image
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CMUX_GHOSTTYKIT_PREPROVISIONED: "1"
        run: |
          set -euo pipefail
          ./scripts/reload.sh --tag pin-dev --derived-data "$RUNNER_TEMP/PinBuild" --swift-frontend-workaround 2>&1 | tee "$RUNNER_TEMP/pin-build.log"
          app="$(awk '/^App path:/{getline; sub(/^  /,""); print; exit}' "$RUNNER_TEMP/pin-build.log")"
          test -d "$app"
          test "$(basename "$app")" = "cmux DEV pin-dev.app"
          test "$(plutil -extract CFBundleIdentifier raw "$app/Contents/Info.plist")" = com.cmuxterm.app.debug.pin.dev
          codesign --verify --strict --verbose=2 "$app"
          stage="$RUNNER_TEMP/pin-dmg"
          mkdir "$stage"
          ditto "$app" "$stage/$(basename "$app")"
          ln -s /Applications "$stage/Applications"
          hdiutil create -srcfolder "$stage" -volname "cmux DEV pin-dev" -format UDZO cmux-pin-dev-arm64.dmg
          hdiutil verify cmux-pin-dev-arm64.dmg
          shasum -a 256 cmux-pin-dev-arm64.dmg
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cmux-pin-dev-macOS-arm64
          path: cmux-pin-dev-arm64.dmg
          if-no-files-found: error
